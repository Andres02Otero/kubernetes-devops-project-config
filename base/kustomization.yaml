apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base del proyecto (todo app), comun a staging y production. Cada entorno
# es un overlay (overlays/staging, overlays/production) que solo define lo
# que cambia. El codigo de las apps vive en otro repo:
# https://github.com/Andres02Otero/kubernetes-devops-submissions
resources:
- namespace.yaml
- postgres-secret.yaml
- postgres.yaml
- todo-backend-deployment.yaml
- todo-backend-service.yaml
- todo-app-image-pvc.yaml
- todo-app-deployment.yaml
- todo-app-service.yaml
- todo-app-ingress.yaml
- todo-random-article-cronjob.yaml
- broadcaster-deployment.yaml

# Tags por defecto; cada overlay fija los suyos (los workflows del repo de
# codigo los reescriben).
images:
- name: andres09otero/todo-app
  newTag: 1.7.0
- name: andres09otero/todo-backend
  newTag: 3.2.0
- name: andres09otero/todo-random-article
  newTag: 1.0.0
- name: andres09otero/todo-broadcaster
  newTag: 1.1.0
