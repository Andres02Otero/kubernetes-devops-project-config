# Los dos Ingress reclamarian / en Traefik: staging responde solo al host
# staging.localhost (http://staging.localhost:8081); production sigue en
# http://localhost:8081.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-app-ingress
spec:
  rules:
    - host: staging.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todo-app-svc
                port:
                  number: 1234
