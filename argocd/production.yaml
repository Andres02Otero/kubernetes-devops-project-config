# Application de ArgoCD del entorno production. Se aplica una vez:
#   kubectl apply -n argocd -f argocd/production.yaml
apiVersion: argoproj.io/v1alpha1

kind: Application

metadata:
  name: project
  namespace: argocd

spec:
  project: default

  source:
    # Desde el ejercicio 4.10 ArgoCD lee solo este repo de configuracion.
    repoURL: https://github.com/Andres02Otero/kubernetes-devops-project-config
    path: overlays/production
    targetRevision: main

  destination:
    server: https://kubernetes.default.svc
    namespace: project

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
